# Local development only. Production uses a hosted Postgres via DATABASE_URL.
services:
  web:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
          ignore:
            - node_modules/
            - dist/
        - action: sync
          path: ./server
          target: /app/server
          ignore:
            - node_modules/
            - db/migrations/
        # Validation rules used by both the form and the server.
        - action: sync
          path: ./shared
          target: /app/shared
        # Restarting applies new migrations on startup.
        - action: sync+restart
          path: ./server/db/migrations
          target: /app/server/db/migrations
        - action: rebuild
          path: package-lock.json

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
